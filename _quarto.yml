project:
 type: website
 resources:
  - funding.json
 render:
  - "**/*.qmd"
  - "**/*.ipynb"


execute:
 freeze: true

website:
 draft-mode: visible
 title: "iSRL"
 site-url: "https://isrl.in"
 description: "Open research lab building IFID — the data coordination layer for Indian packaged food ingredient identity."
 image: "assets/og-image.png"
 favicon: "assets/isrl-logo-square.png"
 google-analytics: "G-8PD6FFEJEV"
 open-graph:
  locale: en_US
  site-name: iSRL
 twitter-card:
  card-style: summary_large_image
  site: "@isrl_research"
 navbar:
  pinned: true
  right:
    - href: index.qmd
      text: Home
    - href: join-us.qmd
      text: Join us
    - href: bulletin/
      text: Bulletin 

    - text: Research
      menu:
        - href: pub/index.qmd
          text: Publications
        - href: roadmap.qmd
          text: Roadmap
        - href: https://zenodo.org/communities/isrl/records
          text: Zenodo
    - text: About
      menu:
        - href: about.qmd
          text: About
        - href: team/index.qmd
          text: Team
        - href: governance.qmd
          text: Governance
        - href: fund.qmd
          text: Funding


    - icon: github
      href: https://github.com/isrl-research
      aria-label: GitHub
  llms-txt: true



format:
 html:
  theme:
   - litera
   - brand
   - custom.scss
  css: styles.css
  toc: true
  fontsize: 17px
  backgroundcolor: '#f7f6f2'
  include-in-header: _includes/_base-jsonld.html
  filters:
    - highlight-span.lua
    - jsonld.lua
    - review-layer.lua
  reference-location: margin
